# Edição Editora Arcano 3: every push to a helper's branch (deepseek/...)
# gets the checks a publication needs before anyone merges it: the
# library crates' clippy, the whole test suite and the added-lines rules
# (scripts/check_added_lines.sh). A green mark on the branch means the
# stage can go to `novidades`.
name: checks

on:
  push:
    branches: ['deepseek/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev fonts-dejavu-core
      - name: Added lines
        env:
          FORBIDDEN_WORDS: ${{ vars.FORBIDDEN_WORDS }}
        run: scripts/check_added_lines.sh origin/novidades
      - name: Clippy (library crates)
        run: cargo clippy -p tracedraw-core -p tracedraw-text -p tracedraw-render -p tracedraw-io -- -D warnings
      - name: Tests
        run: cargo test --workspace

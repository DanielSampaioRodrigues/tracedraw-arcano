welcome.choose_workspace = "Wybierz obszar roboczy"
welcome.get_started = "Rozpocznij"
welcome.learn = "Nauka"
welcome.learn_1_body = "Wybierz narzędzie z przybornika (przytrzymaj przycisk, aby otworzyć wysuwane menu) i przeciągnij na stronie. Przytrzymaj Ctrl, aby ograniczyć, Shift, aby rysować od środka."
welcome.learn_1_title = "Rysowanie"
welcome.learn_2_body = "Kliknij, aby zaznaczyć, kliknij ponownie, aby wyświetlić uchwyty obrotu i pochylenia, przeciągaj narożniki, aby skalować. Klawisze strzałek przesuwają; Shift+strzałki przesuwają dziesięć razy dalej."
welcome.learn_2_title = "Zaznaczanie i przekształcanie"
welcome.learn_3_body = "Kliknij lewym przyciskiem kolor palety, aby ustawić wypełnienie, prawym, aby ustawić kontur. Panel Właściwości edytuje wypełnienia gradientowe, deseniem, teksturą i siatkowe."
welcome.learn_3_title = "Wypełnienia i kontury"
welcome.learn_4_body = "Narzędzie Kształt (F10) edytuje węzły: kliknij dwukrotnie odcinek, aby dodać węzeł, kliknij dwukrotnie węzeł, aby go usunąć, a na pasku właściwości wybieraj węzły ostre, gładkie i symetryczne."
welcome.learn_4_title = "Węzły"
welcome.learn_5_body = "Efekty pozostają edytowalne: otwórz panel efektu z menu Efekty, zmień wartości, a obiekt się zaktualizuje. Spłaszcz efekty utrwala je na stałe."
welcome.learn_5_title = "Efekty"
welcome.my_templates = "Moje szablony"
welcome.new_document = "Nowy dokument"
welcome.new_from_template = "Nowy z szablonu"
welcome.news_1_body = "Obrys, mieszanie, obwiednia, perspektywa, wytłaczanie, faza, cień blokowy, soczewka i niejednolita przezroczystość działają teraz na żywo: zmieniaj je w dowolnej chwili w ich panelach."
welcome.news_1_title = "Efekty na żywo"
welcome.news_2_body = "Tekst akapitowy z kolumnami, punktorami, inicjałami, tabulatorami, dzieleniem wyrazów, trackingiem, przesunięciem linii bazowej, funkcjami OpenType i tekstem na ścieżce."
welcome.news_2_title = "Silnik tekstu"
welcome.news_3_body = "Interfejs jest dostępny w językach: angielskim, chińskim, hindi, hiszpańskim, francuskim, arabskim, bengalskim, rosyjskim, portugalskim (Brazylia), indonezyjskim, niemieckim i japońskim. Zmienisz go w menu Narzędzia > Opcje > Obszar roboczy."
